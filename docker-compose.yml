version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_dev}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-brewlite}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    environment:
      # Trong container, DB luôn ở hostname 'postgres' — không lấy DATABASE_URL từ .env
      # vì .env dùng localhost cho trường hợp chạy npm run dev ngoài Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD:-brewlite_dev}@postgres:5432/${POSTGRES_DB:-brewlite}
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploy-use-random-32-chars}
      # origin của frontend — trình duyệt dùng localhost, không phải tên service Docker
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* bị bake vào JS bundle lúc build.
        # Trình duyệt gọi backend qua host machine (localhost), không qua hostname Docker nội bộ.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
